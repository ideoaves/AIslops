<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ノードメモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
  <h1>相関図エディタ</h1>
  <button id="new">新規作成</button>
  <button id="import">JSON読み込み</button>
  <input id="file" type="file" accept=".json" hidden>
  <button id="export">JSON書き出し</button>
</div>

<div id="editor">
  <h2>グループ設定 <span id="target"></span></h2>
  <div id="panel"></div>
</div>

<div id="canvas">
  <svg id="svg">
    <rect id="bg" x="0" y="0" width="100%" height="100%"/>
    <g id="vp">
      <g id="gg"><!-- グループシェイプ --></g>
      <g id="gl"><!-- リンク --></g>
      <g id="gn"><!-- ノード --></g>
    </g>
  </svg>
</div>


<script>
// 定数
const NODE_W = 160, NODE_H = 38;
const HW = NODE_W / 2, HH = NODE_H / 2;
const STORAGE_KEY = 'correlationDiagram';

const data = { nodes: [], links: [], groups: [] };

// DOM / 状態
const svg = document.getElementById('svg');
const vp  = document.getElementById('vp');
const gg  = document.getElementById('gg');
const gl  = document.getElementById('gl');
const gn  = document.getElementById('gn');

let vx = 0, vy = 0, vk = 1;
let dragNode = null, dragOrig = null;
let rightLinkSrc = null;
let selectedNodeId = null, selectedLinkId = null;

// 履歴
const undoStack = [], redoStack = [];
const MAX_HISTORY = 50;

function saveHistory() {
  undoStack.push(JSON.parse(JSON.stringify(data)));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
}

function applySnapshot(snapshot) {
  data.nodes  = snapshot.nodes;
  data.links  = snapshot.links;
  data.groups = snapshot.groups;
  render();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.parse(JSON.stringify(data)));
  applySnapshot(undoStack.pop());
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.parse(JSON.stringify(data)));
  applySnapshot(redoStack.pop());
}


// ユーティリティ
const genId    = () => 'id_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
const nodeById = id => data.nodes.find(n => n.id === id);
const linkById = id => data.links.find(l => l.id === id);
const groupsOf = nid => data.groups.filter(g => g.nodeIds.includes(nid));
const svgPt    = (cx, cy) => ({ x: (cx - vx) / vk, y: (cy - vy) / vk });
const ns       = 'http://www.w3.org/2000/svg';
const mksvg    = tag => document.createElementNS(ns, tag);

function setVP() {
  vp.style.transform = `translate(${vx}px,${vy}px) scale(${vk})`;
}

// 文字入力中かどうか(ショートカットを止める判定に使う)
function isTextEntry(el) {
  if (!el) return false;
  return el.isContentEditable || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
}

// 貼り付けは書式を捨ててプレーンテキストで挿入する
function attachPlainPaste(el) {
  el.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;
    // insertText なら input イベントもブラウザの取り消し履歴も維持される
    if (document.execCommand('insertText', false, text)) return;

    // execCommand が使えない環境向けのフォールバック
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(text));
    sel.collapseToEnd();
    el.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

function clearSelection() {
  if (selectedNodeId) {
    const card = gn.querySelector(`[data-node-id="${selectedNodeId}"] .card`);
    if (card) { card.style.borderColor = ''; card.style.borderWidth = ''; }
    selectedNodeId = null;
    renderGroupEditor();
  }
  if (selectedLinkId) {
    selectedLinkId = null;
    renderLinks();
  }
}

function boxExitDist(ox, oy, ux, uy, hw, hh_up, hh_dn) {
  const ts = [];
  if (ux > 1e-9) {
    const t = (hw - ox) / ux, y = oy + uy * t;
    if (t > -1e-6 && y >= -hh_up - 1e-6 && y <= hh_dn + 1e-6) ts.push(t);
  }
  if (ux < -1e-9) {
    const t = (-hw - ox) / ux, y = oy + uy * t;
    if (t > -1e-6 && y >= -hh_up - 1e-6 && y <= hh_dn + 1e-6) ts.push(t);
  }
  if (uy > 1e-9) {
    const t = (hh_dn - oy) / uy, x = ox + ux * t;
    if (t > -1e-6 && Math.abs(x) <= hw + 1e-6) ts.push(t);
  }
  if (uy < -1e-9) {
    const t = (-hh_up - oy) / uy, x = ox + ux * t;
    if (t > -1e-6 && Math.abs(x) <= hw + 1e-6) ts.push(t);
  }
  if (!ts.length) {
    if (Math.abs(ux) > 1e-9) ts.push(hw / Math.abs(ux));
    if (uy >  1e-9) ts.push(hh_dn / uy);
    if (uy < -1e-9) ts.push(hh_up / (-uy));
  }
  return ts.length ? Math.min(...ts) : 0;
}

// グループ形状
const GROUP_PAD = 30;  // ノード外周からの余白
const GROUP_R   = 30;  // 角の丸め半径
const GROUP_EPS = 30;   // 同一座標とみなす許容差(px)
// info の切り抜き枠。中の div は内容分の高さしか持たないので大きめで問題ない
const GROUP_INFO_H = 1000;

// 所属ノードの矩形(余白込み)一覧
function memberRects(group) {
  return group.nodeIds.map(id => nodeById(id)).filter(Boolean).map(n => ({
    x0: n.x - HW - GROUP_PAD,
    y0: n.y - HH - GROUP_PAD,
    x1: n.x + HW + GROUP_PAD,
    y1: n.y - HH + (n._h || NODE_H) + GROUP_PAD
  }));
}

function groupBBox(group) {
  const rects = memberRects(group);
  if (rects.length < 2) return null;
  const x = Math.min(...rects.map(r => r.x0));
  const y = Math.min(...rects.map(r => r.y0));
  const w = Math.max(...rects.map(r => r.x1)) - x;
  const h = Math.max(...rects.map(r => r.y1)) - y;
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
}

// 近接する座標をまとめた昇順の目盛りを作る
function axisTicks(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const ticks = [];
  sorted.forEach(v => {
    if (!ticks.length || v - ticks[ticks.length - 1] > GROUP_EPS) ticks.push(v);
  });
  return ticks;
}

const tickIndex = (ticks, v) => {
  let best = 0;
  for (let i = 1; i < ticks.length; i++) {
    if (Math.abs(ticks[i] - v) < Math.abs(ticks[best] - v)) best = i;
  }
  return best;
};

// 矩形群の和集合の輪郭を、頂点列(ループ)の配列として返す
function unionOutline(rects) {
  const xs = axisTicks(rects.flatMap(r => [r.x0, r.x1]));
  const ys = axisTicks(rects.flatMap(r => [r.y0, r.y1]));
  const nx = xs.length - 1, ny = ys.length - 1;
  if (nx < 1 || ny < 1) return [];

  // 目盛りで分割したセルの占有マップを作る
  const filled = new Uint8Array(nx * ny);
  const at = (i, j) => (i < 0 || j < 0 || i >= nx || j >= ny) ? 0 : filled[j * nx + i];
  rects.forEach(r => {
    const i0 = tickIndex(xs, r.x0), i1 = tickIndex(xs, r.x1);
    const j0 = tickIndex(ys, r.y0), j1 = tickIndex(ys, r.y1);
    for (let j = j0; j < j1; j++) {
      for (let i = i0; i < i1; i++) filled[j * nx + i] = 1;
    }
  });

  // 外周の辺だけを時計回りで集める(セル同士が接する内部の辺は生成しない)
  const key   = (x, y) => x + ',' + y;
  const edges = new Map();
  const addEdge = (ax, ay, bx, by) => {
    const k = key(ax, ay);
    if (!edges.has(k)) edges.set(k, []);
    edges.get(k).push({ x: bx, y: by });
  };
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      if (!at(i, j)) continue;
      const x0 = xs[i], x1 = xs[i + 1], y0 = ys[j], y1 = ys[j + 1];
      if (!at(i, j - 1)) addEdge(x0, y0, x1, y0);
      if (!at(i + 1, j)) addEdge(x1, y0, x1, y1);
      if (!at(i, j + 1)) addEdge(x1, y1, x0, y1);
      if (!at(i - 1, j)) addEdge(x0, y1, x0, y0);
    }
  }

  // 辺を数珠つなぎにして閉ループを取り出す
  const takeEdge = k => {
    const list = edges.get(k);
    if (!list) return null;
    const p = list.pop();
    if (!list.length) edges.delete(k);
    return p;
  };

  const loops = [];
  for (const start of [...edges.keys()]) {
    const [sx, sy] = start.split(',').map(Number);
    let p = takeEdge(start);
    while (p) {
      const loop = [{ x: sx, y: sy }];
      while (p && !(p.x === sx && p.y === sy)) {
        loop.push(p);
        p = takeEdge(key(p.x, p.y));
      }
      if (p && loop.length >= 4) loops.push(dropCollinear(loop));
      p = takeEdge(start);  // 同じ点から始まる別ループ
    }
  }
  return loops;
}

// 一直線上に並んだ中間点を間引く
function dropCollinear(loop) {
  const n = loop.length, out = [];
  for (let i = 0; i < n; i++) {
    const a = loop[(i - 1 + n) % n], b = loop[i], c = loop[(i + 1) % n];
    if ((a.x === b.x && b.x === c.x) || (a.y === b.y && b.y === c.y)) continue;
    out.push(b);
  }
  return out;
}

// 頂点列を角丸のパスにする
function loopToPath(loop, r) {
  const n = loop.length;
  if (n < 3) return '';
  const f = v => Math.round(v * 100) / 100;
  const toward = (from, to, len) => {
    const dx = to.x - from.x, dy = to.y - from.y;
    const d = Math.hypot(dx, dy) || 1;
    return { x: from.x + dx / d * len, y: from.y + dy / d * len };
  };

  let d = '';
  for (let i = 0; i < n; i++) {
    const prev = loop[(i - 1 + n) % n], cur = loop[i], next = loop[(i + 1) % n];
    const rIn  = Math.min(r, Math.hypot(cur.x - prev.x, cur.y - prev.y) / 2);
    const rOut = Math.min(r, Math.hypot(next.x - cur.x, next.y - cur.y) / 2);
    const p1 = toward(cur, prev, rIn);
    const p2 = toward(cur, next, rOut);
    d += `${i === 0 ? 'M' : 'L'}${f(p1.x)},${f(p1.y)} `;
    d += `Q${f(cur.x)},${f(cur.y)} ${f(p2.x)},${f(p2.y)} `;
  }
  return d + 'Z';
}

// 輪郭は描画とリンク端点の両方で使うので、形が変わるまで使い回す
const outlineCache = new Map();

function groupOutline(group) {
  const rects = memberRects(group);
  if (rects.length < 2) return null;
  const sig = rects.map(r => `${r.x0},${r.y0},${r.x1},${r.y1}`).join(';');
  const cached = outlineCache.get(group.id);
  if (cached && cached.sig === sig) return cached;
  const entry = { sig, rects, loops: unionOutline(rects) };
  outlineCache.set(group.id, entry);
  return entry;
}

// (px,py) から (ux,uy) 方向に伸ばした半直線が輪郭を最後に横切る距離
function polyExitDist(loops, px, py, ux, uy) {
  let best = null;
  loops.forEach(loop => {
    for (let i = 0; i < loop.length; i++) {
      const a = loop[i], b = loop[(i + 1) % loop.length];
      const sx = b.x - a.x, sy = b.y - a.y;
      const den = ux * sy - uy * sx;
      if (Math.abs(den) < 1e-9) continue;              // 平行
      const t = ((a.x - px) * sy - (a.y - py) * sx) / den;
      const u = ((a.x - px) * uy - (a.y - py) * ux) / den;
      if (t > 1e-6 && u >= -1e-6 && u <= 1 + 1e-6 && (best === null || t > best)) best = t;
    }
  });
  return best;
}

// 端点は中心座標と「中心から (ux,uy) 方向へ出るまでの距離」を返す
function resolveEndpoint(id) {
  const node = nodeById(id);
  if (node) {
    const hh_dn = (node._h || NODE_H) - HH;
    return {
      x: node.x, y: node.y,
      exit: (ox, oy, ux, uy) => boxExitDist(ox, oy, ux, uy, HW, HH, hh_dn)
    };
  }
  const grp = data.groups.find(g => g.id === id);
  if (grp) {
    const b = groupBBox(grp);
    if (!b) return null;
    const outline = groupOutline(grp);
    const hh = b.h / 2;
    return {
      x: b.cx, y: b.cy,
      exit: (ox, oy, ux, uy) => {
        const d = outline && polyExitDist(outline.loops, b.cx + ox, b.cy + oy, ux, uy);
        return d === null || d === undefined
          ? boxExitDist(ox, oy, ux, uy, b.w / 2, hh, hh)
          : d;
      }
    };
  }
  return null;
}

// 矢印はtargetを向く
function normalizeLinks() {
  data.links.forEach(l => {
    if (l.arrow === 'from') { const s = l.source; l.source = l.target; l.target = s; }
    delete l.arrow;
  });
}

// 参照先を失ったリンクを取り除く。リンクに繋がったリンクも連鎖して消える。
function pruneLinks() {
  for (;;) {
    const alive = new Set([
      ...data.nodes.map(n => n.id),
      ...data.groups.map(g => g.id),
      ...data.links.map(l => l.id)
    ]);
    const kept = data.links.filter(l => alive.has(l.source) && alive.has(l.target));
    if (kept.length === data.links.length) return;
    data.links = kept;
  }
}

// 右クリックリンク接続
function handleRightClickConnect(endpointId, highlightFn) {
  if (!rightLinkSrc) {
    rightLinkSrc = endpointId;
    highlightFn();
  } else if (rightLinkSrc === endpointId) {
    cancelRightLinkMode();
  } else {
    saveHistory();
    data.links.push({ id: genId(), source: rightLinkSrc, target: endpointId, text: '' });
    renderLinks();
    cancelRightLinkMode();
  }
}


// 保存 / 読み込み
// _ で始まるのは描画時に測り直す実行時キャッシュ(_h など)なので保存しない
const stripRuntime = obj => Object.fromEntries(
  Object.entries(obj).filter(([k]) => !k.startsWith('_'))
);

function serialize() {
  return {
    nodes:  data.nodes.map(stripRuntime),
    links:  data.links.map(stripRuntime),
    groups: data.groups.map(stripRuntime)
  };
}

function saveToLocalStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    ...serialize(),
    view: { x: vx, y: vy, k: vk }
  }));
}

async function initData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const p = JSON.parse(saved);
      const d = p.diagram || p;
      if (d.nodes)  data.nodes  = d.nodes;
      if (d.links)  data.links  = d.links;
      if (d.groups) data.groups = d.groups;
      if (p.view) { vx = p.view.x || 0; vy = p.view.y || 0; vk = p.view.k || 1; }
      normalizeLinks();
      return 'storage';
    } catch (e) { console.warn('localStorage 読み込み失敗:', e); }
  }
  try {
    const res  = await fetch('data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const d    = json.diagram || json;
    if (d.nodes)  data.nodes  = d.nodes;
    if (d.links)  data.links  = d.links;
    if (d.groups) data.groups = d.groups;
    normalizeLinks();
    return 'file';
  } catch (e) {
    console.error('data.json 読み込み失敗:', e);
    return 'empty';
  }
}

// グループ描画
function renderGroups() {
  gg.innerHTML = '';
  data.groups.forEach(group => {
    const outline = groupOutline(group);
    if (!outline || !outline.loops.length) return;
    const { rects, loops } = outline;

    const shape = mksvg('path');
    shape.setAttribute('d', loops.map(l => loopToPath(l, GROUP_R)).join(' '));
    shape.setAttribute('fill-rule', 'nonzero');
    shape.style.setProperty('--group-color', group.color);
    shape.dataset.groupId = group.id;
    if (group.id === rightLinkSrc) shape.classList.add('highlighted');

    const head = rects.reduce((a, r) =>
      (r.y0 < a.y0 - GROUP_EPS || (Math.abs(r.y0 - a.y0) <= GROUP_EPS && r.x0 < a.x0)) ? r : a, rects[0]);

    const label = mksvg('text');
    label.setAttribute('class', 'title');
    label.setAttribute('x', head.x0 + 14);
    label.setAttribute('y', head.y0 + 20);
    label.style.setProperty('--group-color', group.color);
    label.textContent = group.name;

    const fo = mksvg('foreignObject');
    fo.setAttribute('x',      head.x0 + 12);
    fo.setAttribute('y',      head.y0 + 26);
    fo.setAttribute('width',  Math.max(100, (head.x1 - head.x0) - 24));
    fo.setAttribute('height', GROUP_INFO_H);
    fo.setAttribute('pointer-events', 'none');

    const infoDiv = document.createElement('div');
    infoDiv.className = 'info';
    infoDiv.contentEditable = 'true';
    attachPlainPaste(infoDiv);
    infoDiv.textContent = group.info || '';
    let infoEdited = false;
    infoDiv.addEventListener('focus',     () => { infoEdited = false; });
    infoDiv.addEventListener('input',     () => {
      if (!infoEdited) { saveHistory(); infoEdited = true; }
      group.info = infoDiv.innerText;
    });
    infoDiv.addEventListener('mousedown', e => e.stopPropagation());
    infoDiv.addEventListener('click',     e => e.stopPropagation());
    fo.appendChild(infoDiv);
    fo.addEventListener('dblclick', e => e.stopPropagation());

    shape.addEventListener('contextmenu', e => {
      e.preventDefault();
      e.stopPropagation();
      handleRightClickConnect(group.id, () => {
        shape.classList.add('highlighted');
      });
    });

    gg.append(shape, label, fo);
  });
}


// リンク幾何
const LINK_GAP = 6;
const LINK_SEP = 18;
const LINK_LABEL_T = 0.25;

function computeLinkGeometry() {
  const pairKey = l => [l.source, l.target].sort().join('|');
  const cnt = {}, seen = {}, slot = new Map();
  data.links.forEach(l => { const k = pairKey(l); cnt[k] = (cnt[k] || 0) + 1; });
  data.links.forEach(l => {
    const k = pairKey(l);
    seen[k] = (seen[k] || 0) + 1;
    slot.set(l.id, { i: seen[k], total: cnt[k] });
  });

  const geo = new Map();
  const linkIds = new Set(data.links.map(l => l.id));
  const endpointOf = id => {
    const g = geo.get(id);
    if (g) return { x: g.mx, y: g.my, exit: () => 0 };
    if (linkIds.has(id)) return null;
    return resolveEndpoint(id);
  };

  let progress = true;
  while (progress) {
    progress = false;
    data.links.forEach(link => {
      if (geo.has(link.id)) return;
      const srcEp = endpointOf(link.source);
      const tgtEp = endpointOf(link.target);
      if (!srcEp || !tgtEp) return;

      const dx = tgtEp.x - srcEp.x, dy = tgtEp.y - srcEp.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;

      const [sid] = [link.source, link.target].sort();
      const sep = sid === link.source ? srcEp : tgtEp;
      const tep = sep === srcEp ? tgtEp : srcEp;
      const rdx = tep.x - sep.x, rdy = tep.y - sep.y;
      const rlen = Math.hypot(rdx, rdy) || 1;
      const rnx = -rdy / rlen, rny = rdx / rlen;

      const { i, total } = slot.get(link.id);
      const off = total > 1 ? (i - (total + 1) / 2) * LINK_SEP : 0;
      const ox = rnx * off, oy = rny * off;

      const dSrc = srcEp.exit(ox, oy,  ux,  uy);
      const dTgt = tgtEp.exit(ox, oy, -ux, -uy);

      const sx = srcEp.x + ox + ux * (dSrc + LINK_GAP);
      const sy = srcEp.y + oy + uy * (dSrc + LINK_GAP);
      const tx = tgtEp.x + ox - ux * (dTgt + LINK_GAP);
      const ty = tgtEp.y + oy - uy * (dTgt + LINK_GAP);

      geo.set(link.id, {
        sx, sy, tx, ty, ux, uy,
        mx: (sx + tx) / 2, my: (sy + ty) / 2,
        lx: sx + (tx - sx) * LINK_LABEL_T,
        ly: sy + (ty - sy) * LINK_LABEL_T
      });
      progress = true;
    });
  }
  return geo;
}

// リンク描画
function renderLinks() {
  gl.innerHTML = '';
  const geo = computeLinkGeometry();

  data.links.forEach(link => {
    const q = geo.get(link.id);
    if (!q) return;
    const { sx, sy, tx, ty, ux, uy, lx, ly } = q;
    const pathD = `M${sx},${sy} L${tx},${ty}`;

    const g = mksvg('g');
    g.setAttribute('class', 'link');
    g.dataset.linkId = link.id;

    const path = mksvg('path');
    path.setAttribute('class', 'line');
    path.setAttribute('d', pathD);
    if (link.id === selectedLinkId) g.classList.add('selected');
    if (link.id === rightLinkSrc)   g.classList.add('highlighted');
    const arrow = mksvg('polyline');
    arrow.setAttribute('class', 'arrow');
    arrow.setAttribute('points',
      `${tx - 7*ux + 2.5*uy},${ty - 7*uy - 2.5*ux} ${tx},${ty} ${tx - 7*ux - 2.5*uy},${ty - 7*uy + 2.5*ux}`);

    const hit = mksvg('path');
    hit.setAttribute('class', 'hit');
    hit.setAttribute('d', pathD);

    const FO_W = 120;
    const fo = mksvg('foreignObject');
    fo.setAttribute('x', lx - FO_W / 2);
    fo.setAttribute('y', ly - 20);
    fo.setAttribute('width', FO_W);
    fo.setAttribute('height', 20);
    fo.setAttribute('pointer-events', 'none');

    const labelDiv = document.createElement('div');
    labelDiv.className = 'label';
    labelDiv.contentEditable = 'true';
    attachPlainPaste(labelDiv);
    labelDiv.textContent = link.text || '';
    let labelEdited = false;
    labelDiv.addEventListener('focus', () => { labelEdited = false; });
    labelDiv.addEventListener('input', () => {
      if (!labelEdited) { saveHistory(); labelEdited = true; }
      link.text = labelDiv.innerText;
    });
    labelDiv.addEventListener('mousedown', e => e.stopPropagation());
    labelDiv.addEventListener('click',     e => e.stopPropagation());
    fo.appendChild(labelDiv);
    fo.addEventListener('dblclick', e => e.stopPropagation());

    // クリック: 選択
    hit.addEventListener('click', e => {
      e.stopPropagation();
      clearSelection();
      selectedLinkId = link.id;
      renderLinks();
    });
    // ダブルクリック: 削除
    hit.addEventListener('dblclick', e => {
      e.stopPropagation();
      saveHistory();
      data.links = data.links.filter(l => l.id !== link.id);
      pruneLinks();
      if (selectedLinkId === link.id) selectedLinkId = null;
      renderLinks();
    });
    // 右クリック: 向き反転 / Shift+右クリック・接続中は接続対象にする
    hit.addEventListener('contextmenu', e => {
      e.preventDefault();
      e.stopPropagation();
      if (e.shiftKey || rightLinkSrc) {
        handleRightClickConnect(link.id, () => g.classList.add('highlighted'));
        return;
      }
      saveHistory();
      const s = link.source; link.source = link.target; link.target = s;
      renderLinks();
    });

    g.append(path, arrow, hit, fo);
    gl.appendChild(g);
  });
}

// ノード描画
// 折り返し・貼り付け・IME確定など、あらゆる高さ変化を拾って foreignObject に反映する
const cardObserver = new ResizeObserver(entries => {
  let changed = false;
  entries.forEach(entry => {
    const node = nodeById(entry.target.dataset.nodeId);
    if (node && measureNode(node)) changed = true;
  });
  if (changed) { renderGroups(); renderLinks(); }
});

function renderNodes() {
  cardObserver.disconnect();
  gn.innerHTML = '';
  data.nodes.forEach(addNodeEl);
}

function addNodeEl(node) {
  const g = mksvg('g');
  g.setAttribute('class', 'node');
  g.dataset.nodeId = node.id;
  g.setAttribute('transform', `translate(${node.x},${node.y})`);

  const fo = mksvg('foreignObject');
  fo.setAttribute('x', -HW);
  fo.setAttribute('y', -HH);
  fo.setAttribute('width',  NODE_W);
  fo.setAttribute('height', 300);
  fo.setAttribute('pointer-events', 'none');

  fo.appendChild(buildCardHTML(node));
  fo.addEventListener('dblclick', e => e.stopPropagation());

  const handle = mksvg('rect');
  handle.setAttribute('class', 'handle');
  handle.setAttribute('x',      -HW);
  handle.setAttribute('y',      -HH);
  handle.setAttribute('width',  NODE_W);
  handle.setAttribute('height', 10);

  attachHandleEvents(handle, node);

  g.append(fo, handle);
  gn.appendChild(g);

  measureNode(node);
  cardObserver.observe(fo.querySelector('.card'));
}

// カードの実際の高さを測り、foreignObject の切り抜き範囲を合わせる。変化があれば true。
function measureNode(node) {
  const g    = gn.querySelector(`[data-node-id="${node.id}"]`);
  const fo   = g?.querySelector('foreignObject');
  const card = fo?.querySelector('.card');
  if (!fo || !card) return false;

  const h = card.offsetHeight;
  if (node._h === h) return false;
  node._h = h;
  fo.setAttribute('height', h);
  return true;
}

// 高さが変わるとグループの外形とリンクの端点も変わるので描き直す
function syncNodeHeight(node) {
  if (!measureNode(node)) return;
  renderGroups();
  renderLinks();
}

function buildCardHTML(node) {
  // カード全体
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.nodeId = node.id;

  // ノード名
  const nameH1 = document.createElement('h1');
  nameH1.className = 'name';
  nameH1.contentEditable = 'true';
  attachPlainPaste(nameH1);
  nameH1.textContent = node.name;
  let nameEdited = false;
  nameH1.addEventListener('focus',     () => { nameEdited = false; });
  nameH1.addEventListener('input',     () => {
    if (!nameEdited) { saveHistory(); nameEdited = true; }
    node.name = nameH1.innerText.trim() || node.name;
    if (selectedNodeId === node.id) elTarget.textContent = node.name || '(無題)';
    syncNodeHeight(node);
  });
  nameH1.addEventListener('mousedown', e => e.stopPropagation());
  nameH1.addEventListener('click',     e => e.stopPropagation());

  // 情報テキスト
  const infoDiv = document.createElement('div');
  infoDiv.className = 'info';
  infoDiv.contentEditable = 'true';
  attachPlainPaste(infoDiv);
  infoDiv.textContent = node.info || '';
  let infoEdited = false;
  infoDiv.addEventListener('focus',     () => { infoEdited = false; });
  infoDiv.addEventListener('input',     () => {
    if (!infoEdited) { saveHistory(); infoEdited = true; }
    node.info = infoDiv.innerText;
    syncNodeHeight(node);
  });
  infoDiv.addEventListener('mousedown', e  => e.stopPropagation());
  infoDiv.addEventListener('click',     e  => e.stopPropagation());

  // グループタグ一覧(表示のみ。編集は左上のパネルで行う)
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'tags';
  refreshTags(tagsDiv, node.id);

  card.append(nameH1, infoDiv, tagsDiv);
  return card;
}

// グループ設定パネル(左上)
const elTarget = document.getElementById('target');
const elPanel  = document.getElementById('panel');

// #rgb / #rrggbb / # なしを受け付けて #rrggbb に揃える。不正なら null。
const HEX_RE = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i;
function normalizeHex(v) {
  const m = String(v).trim().match(HEX_RE);
  if (!m) return null;
  const h = m[1];
  return '#' + (h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h).toLowerCase();
}

const randomHex = () => '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');

// 色見本つきの HEX 入力欄。onChange には正規化済みの値だけを渡す。
// opts.collapsible: 普段は色見本だけを出し、クリックで入力欄を開く
function hexField(initial, onChange, opts = {}) {
  let current = normalizeHex(initial) || '#888888';

  const wrap = document.createElement('div');
  wrap.className = 'hex';

  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.style.background = current;

  const input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  input.spellcheck = false;
  input.maxLength = 7;
  input.placeholder = '#rrggbb';

  input.addEventListener('input', () => {
    const hex = normalizeHex(input.value);
    wrap.classList.toggle('invalid', !hex);
    if (!hex) return;
    current = hex;
    chip.style.background = hex;
    onChange(hex);
  });
  // 入力途中の不正な文字列は、欄を離れた時点で直前の値に戻す
  input.addEventListener('blur', () => {
    input.value = current;
    wrap.classList.remove('invalid');
    if (opts.collapsible) wrap.classList.add('collapsed');
  });

  if (opts.collapsible) {
    wrap.classList.add('collapsible', 'collapsed');
    chip.title = '色を編集';
    chip.addEventListener('click', () => {
      wrap.classList.remove('collapsed');
      input.focus();
      input.select();
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') input.blur(); });
  }

  wrap.append(chip, input);
  return { el: wrap, input, get value() { return current; } };
}

const tagsOf = nodeId => gn.querySelector(`[data-node-id="${nodeId}"] .tags`);

// 所属が変わるとタグ・カード高さ・グループ外形・リンク端点がまとめて動く
function applyGroupChange(node) {
  const tags = tagsOf(node.id);
  if (tags) refreshTags(tags, node.id);
  measureNode(node);
  renderGroups();
  renderLinks();
}

// 名前や色の変更は所属している全ノードのタグに波及する
function applyGroupEdit() {
  data.nodes.forEach(n => {
    const tags = tagsOf(n.id);
    if (tags) refreshTags(tags, n.id);
    measureNode(n);
  });
  renderGroups();
  renderLinks();
}

function renderGroupEditor() {
  elPanel.innerHTML = '';
  const node = selectedNodeId ? nodeById(selectedNodeId) : null;

  if (!node) {
    elTarget.textContent = '';
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'ノードを選択してください';
    elPanel.append(hint);
    return;
  }
  elTarget.textContent = node.name || '(無題)';

  // 新規グループ作成
  const sec1 = document.createElement('div');
  sec1.className = 'section';

  const row = document.createElement('div');
  row.className = 'new';

  const nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.placeholder = 'グループ名';

  const colIn = hexField(randomHex(), () => {});

  const createBtn = document.createElement('button');
  createBtn.textContent = '作成';

  const create = () => {
    const nm = nameIn.value.trim();
    if (!nm) return;
    saveHistory();
    data.groups.push({ id: genId(), nodeIds: [node.id], name: nm, color: colIn.value });
    nameIn.value = '';
    renderGroupEditor();
    applyGroupChange(node);
  };
  createBtn.addEventListener('click', create);
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') create(); });

  row.append(nameIn, colIn.el, createBtn);
  sec1.append(row);

  // 所属の切り替え
  const sec2 = document.createElement('div');
  sec2.className = 'section';

  const list = document.createElement('div');
  list.className = 'list';

  data.groups.forEach(grp => {
    const row2 = document.createElement('div');
    row2.className = 'row';

    // 所属
    const cb = document.createElement('input');
    cb.type    = 'checkbox';
    cb.checked = grp.nodeIds.includes(node.id);
    cb.title   = '選択中のノードを所属させる';
    cb.addEventListener('change', () => {
      saveHistory();
      if (cb.checked) {
        if (!grp.nodeIds.includes(node.id)) grp.nodeIds.push(node.id);
      } else {
        grp.nodeIds = grp.nodeIds.filter(id => id !== node.id);
      }
      applyGroupChange(node);
    });

    // 色
    let colorEdited = false;
    const col = hexField(grp.color, hex => {
      if (!colorEdited) { saveHistory(); colorEdited = true; }
      grp.color = hex;
      applyGroupEdit();
    }, { collapsible: true });
    col.input.title = 'グループの色 (HEX)';
    col.input.addEventListener('focus', () => { colorEdited = false; });

    // 名前
    const nm = document.createElement('input');
    nm.type  = 'text';
    nm.className = 'name';
    nm.value = grp.name;
    nm.title = 'グループ名';
    let renamed = false;
    nm.addEventListener('focus', () => { renamed = false; });
    nm.addEventListener('input', () => {
      if (!renamed) { saveHistory(); renamed = true; }
      grp.name = nm.value;
      applyGroupEdit();
    });

    // 削除(取り消しは Ctrl+Z)
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = 'グループを削除';
    del.addEventListener('click', () => {
      saveHistory();
      data.groups = data.groups.filter(g => g.id !== grp.id);
      pruneLinks();          // グループを端点にしていたリンクも連鎖で消す
      renderGroupEditor();
      applyGroupEdit();
    });

    row2.append(cb, col.el, nm, del);
    list.appendChild(row2);
  });

  if (!data.groups.length) {
    const empty = document.createElement('p');
    empty.className = 'hint';
    empty.textContent = 'グループがありません';
    list.append(empty);
  }

  sec2.append(list);
  elPanel.append(sec1, sec2);
}

function refreshTags(tagsEl, nodeId) {
  tagsEl.innerHTML = '';
  groupsOf(nodeId).forEach(grp => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.style.setProperty('--group-color', grp.color);
    span.textContent = grp.name;
    tagsEl.appendChild(span);
  });
}

// ハンドルイベント
function attachHandleEvents(handle, node) {
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    dragNode = node;
    const p = svgPt(e.clientX, e.clientY);
    dragOrig = { mx: p.x, my: p.y, nx: node.x, ny: node.y };
  });

  // クリック: ノード選択
  handle.addEventListener('click', e => {
    e.stopPropagation();
    clearSelection();
    selectedNodeId = node.id;
    const card = gn.querySelector(`[data-node-id="${node.id}"] .card`);
    if (card) { card.style.borderColor = 'var(--highlight)'; card.style.borderWidth = '4px 2px 2px'; }
    renderGroupEditor();
  });

  // ダブルクリック: 削除
  handle.addEventListener('dblclick', e => {
    e.stopPropagation();
    saveHistory();
    data.nodes  = data.nodes.filter(n => n.id !== node.id);
    data.groups.forEach(g => { g.nodeIds = g.nodeIds.filter(i => i !== node.id); });
    pruneLinks();
    if (selectedNodeId === node.id) selectedNodeId = null;
    render();
  });

  // 右クリック: 接続モード
  handle.addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
    handleRightClickConnect(node.id, () => {
      const card = gn.querySelector(`[data-node-id="${node.id}"] .card`);
      if (card) { card.style.borderColor = 'var(--highlight)'; card.style.borderWidth = '4px 2px 2px'; }
    });
  });
}

function cancelRightLinkMode() {
  if (rightLinkSrc) {
    const card = gn.querySelector(`[data-node-id="${rightLinkSrc}"] .card`);
    if (card) { card.style.borderColor = rightLinkSrc === selectedNodeId ? 'var(--highlight)' : ''; card.style.borderWidth = rightLinkSrc === selectedNodeId ? '4px 2px 2px' : ''; }
  }
  rightLinkSrc = null;
  resetHandleHighlights();
}

function resetHandleHighlights() {
  gg.querySelectorAll('[data-group-id]').forEach(r => r.classList.remove('highlighted'));
  gl.querySelectorAll('.link').forEach(r => r.classList.remove('highlighted'));
}


// パン & ズーム
window.addEventListener('mousemove', e => {
  if (!dragNode) return;
  const p = svgPt(e.clientX, e.clientY);
  dragNode.x = dragOrig.nx + (p.x - dragOrig.mx);
  dragNode.y = dragOrig.ny + (p.y - dragOrig.my);
  const el = gn.querySelector(`[data-node-id="${dragNode.id}"]`);
  if (el) el.setAttribute('transform', `translate(${dragNode.x},${dragNode.y})`);
  renderGroups();
  renderLinks();
});

window.addEventListener('mouseup', () => {
  dragNode = null;
  dragOrig = null;
});

svg.addEventListener('contextmenu', e => { e.preventDefault(); });

// 何もない場所のクリックで選択解除(ノード/リンク側は stopPropagation 済み)
svg.addEventListener('click', () => clearSelection());

svg.addEventListener('dblclick', e => {
  if (selectedNodeId) return;
  const c = svgPt(e.clientX, e.clientY);
  saveHistory();
  const node = { id: genId(), x: c.x, y: c.y, name: '', info: '' };
  data.nodes.push(node);
  addNodeEl(node);
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect  = svg.getBoundingClientRect();
  const mx    = e.clientX - rect.left;
  const my    = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.88 : 1.14;
  const nk    = Math.max(0.08, Math.min(6, vk * delta));
  vx  = mx - (mx - vx) * (nk / vk);
  vy  = my - (my - vy) * (nk / vk);
  vk  = nk;
  setVP();
}, { passive: false });


// ツールバーボタン
// 新規作成(取り消しは Ctrl+Z)
document.getElementById('new').addEventListener('click', () => {
  saveHistory();
  data.nodes  = [];
  data.links  = [];
  data.groups = [];
  localStorage.removeItem(STORAGE_KEY);
  dataFileHandle = null;   // 元のファイルを空の図で上書きしないよう保存先も外す
  render();
});

// JSON読み込み
document.getElementById('import').addEventListener('click', () => {
  document.getElementById('file').click();
});
document.getElementById('file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const json = JSON.parse(ev.target.result);
      const d = json.diagram || json;
      saveHistory();
      if (d.nodes)  data.nodes  = d.nodes;
      if (d.links)  data.links  = d.links;
      if (d.groups) data.groups = d.groups;
      if (json.view) { vx = json.view.x || 0; vy = json.view.y || 0; vk = json.view.k || 1; }
      normalizeLinks();
      render();
      setVP();
    } catch { alert('JSONの読み込みに失敗しました'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// JSON書き出し
let dataFileHandle = null;

async function exportToFile() {
  try {
    if (!dataFileHandle) {
      dataFileHandle = await window.showSaveFilePicker({
        suggestedName: 'data.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
    }
    const writable = await dataFileHandle.createWritable();
    await writable.write(JSON.stringify({
      version: '1.0',
      diagram: serialize(),
      view:    { x: vx, y: vy, k: vk }
    }, null, 2));
    await writable.close();
  } catch (e) {
    if (e.name !== 'AbortError') dataFileHandle = null;
  }
}

document.getElementById('export').addEventListener('click', exportToFile);



// キーボードショートカット
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    cancelRightLinkMode();
  }
  // 文字入力中は編集操作を優先し、図形側のショートカットは動かさない
  const typing = isTextEntry(document.activeElement);

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (typing) return;
    if (selectedNodeId) {
      saveHistory();
      data.nodes  = data.nodes.filter(n => n.id !== selectedNodeId);
      data.groups.forEach(g => { g.nodeIds = g.nodeIds.filter(i => i !== selectedNodeId); });
      pruneLinks();
      selectedNodeId = null;
      render();
    } else if (selectedLinkId) {
      saveHistory();
      data.links = data.links.filter(l => l.id !== selectedLinkId);
      pruneLinks();
      selectedLinkId = null;
      renderLinks();
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    if (typing) return;
    e.preventDefault();
    if (selectedNodeId) {
      const src = nodeById(selectedNodeId);
      if (src) {
        saveHistory();
        const dup = { id: genId(), x: src.x + 30, y: src.y + 30, name: src.name, info: src.info };
        data.nodes.push(dup);
        addNodeEl(dup);
      }
    }
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
    e.preventDefault();
    undo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    redo();
  }
}, true);


// 初期化
function render() {
  selectedNodeId = null;
  selectedLinkId = null;
  renderNodes();    // 先にカードを測ってから、それに依存する外形と線を描く
  renderGroups();
  renderLinks();
  renderGroupEditor();
}

initData().then(() => {
  render();
  setVP();
  setInterval(saveToLocalStorage, 5000);
});
</script>
